name: Window 10

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Install Ngrok
      run: choco install ngrok -y
    - name: Auth
      run: ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
    - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
    - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "@cyb3rking" -Force)
    - name: Create Verification Free Tunnel
      run: |
        Start-Process ngrok -ArgumentList "http 3389 --log=stdout" -RedirectStandardOutput "ngrok.log"
        Start-Sleep -Seconds 15
        Write-Output "=========================================="
        Write-Output "YOUR PUBLIC RDP ADDRESS:"
        Get-Content ngrok.log | Select-String "url="
        Write-Output "=========================================="
    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
