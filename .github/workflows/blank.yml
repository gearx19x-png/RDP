name: Window 10

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Enable SSH Server
      run: |
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
        Start-Service sshd
        Set-Service -Name sshd -StartupType 'Automatic'
    - name: Set Password and Firewall
      run: |
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "@cyb3rking" -Force)
        Enable-NetFirewallRule -DisplayGroup "OpenSSH Server"
    - name: Initialize Ngrok Tunnel
      run: |
        choco install ngrok -y
        ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
        Start-Process ngrok -ArgumentList "http 22 --log=stdout" -RedirectStandardOutput "ngrok.log"
        Start-Sleep -Seconds 15
        Write-Output "=========================================="
        Write-Output "YOUR WEBBROWSER CONNECTION LINK:"
        Get-Content ngrok.log | Select-String "url="
        Write-Output "=========================================="
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
