name: Window 10

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
    - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
    - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "@cyb3rking" -Force)
    - name: Run Web Desktop Terminal
      run: |
        choco install gotty -y
        Start-Process gotty -ArgumentList "-w powershell"
        Start-Sleep -Seconds 10
    - name: Create Web Tunnel Link
      run: |
        choco install ngrok -y
        ngrok config add-authtoken $Env:NGROK_AUTH_TOKEN
        Start-Process ngrok -ArgumentList "http 8080 --log=stdout" -RedirectStandardOutput "ngrok.log"
        Start-Sleep -Seconds 15
        Write-Output "=========================================="
        Write-Output "YOUR WEBBROWSER CONNECTION LINK:"
        Get-Content ngrok.log | Select-String "url="
        Write-Output "=========================================="
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
